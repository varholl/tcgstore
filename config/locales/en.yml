  pages:
    how_it_works:
      title: "How It Works"
      intro: "Reserving cards is simple. Follow these steps to get the cards you want."
      faq_title: "Frequently Asked Questions"
      steps:
        step_1:
          title: "Browse"
          description: "Explore our catalog and find the cards you're looking for."
        step_2:
          title: "Add to Cart"
          description: "Select the quantity you want and add cards to your cart."
        step_3:
          title: "Submit Reservation"
          description: "Review your cart and submit a reservation request."
        step_4:
          title: "Wait for Preparation"
          description: "We'll prepare the cards you requested and make sure they are all in top condition."
        step_5:
          title: "Payment & Delivery"
          description: "Once we confirm everything is OK, we'll contact you to agree on a payment method and how to get your cards to you — either by shipping or in person."
      faq:
        what_is_reservation:
          question: "What is a reservation?"
          answer: "A reservation is a request to set aside cards for you. It is not a purchase — you pay once we both confirm the reservation and the cards are in order."
        can_i_cancel:
          question: "Can I cancel a reservation?"
          answer: "Yes. You can cancel any pending reservation from your reservations page. Once a reservation has been fulfilled or expired, it cannot be cancelled."
        do_reservations_expire:
          question: "Do reservations expire?"
          answer: "Yes. If we cannot get a full confirmation and agreement on payment and delivery method from you within 3 days, we may mark it as expired and the cards will be made available again."
        are_prices_final:
          question: "Are prices final?"
          answer: "Prices shown are estimates based on current market values, we will update it from time to time based on the latest market values. The final price may vary if the card was not in the published condition and only after confirmation from you."
        need_account:
          question: "Do I need an account?"
          answer: "Yes. You need to create an account and sign in to add cards to your cart and submit reservations."

