  pages:
    about:
      title: "Acerca de Este Sitio"
      greeting: "¡Hola! Soy Matias, jugador de Magic: The Gathering."
      not_a_store: "Esto no es una tienda — soy simplemente un jugador más vendiendo cartas de mi colección personal."
      why_this_site: "Armé este sitio para mantenerme organizado al vender cartas. Hace más fácil para ambos ver lo que hay disponible y llevar un registro de las reservas."
      closing: "¡Gracias por pasar, y buenas partidas!"
    how_it_works:
      title: "Cómo Funciona"
      intro: "Reservar cartas es simple. Seguí estos pasos para conseguir las cartas que querés."
      faq_title: "Preguntas Frecuentes"
      steps:
        step_1:
          title: "Explorar"
          description: "Explorá mi catálogo y encontrá las cartas que buscás."
        step_2:
          title: "Agregar al Carrito"
          description: "Seleccioná la cantidad que querés y agregá las cartas a tu carrito."
        step_3:
          title: "Enviar Reserva"
          description: "Revisá tu carrito y enviá una solicitud de reserva."
        step_4:
          title: "Esperar Preparación"
          description: "Prepararé las cartas que solicitaste y me aseguraré de que estén todas en óptimas condiciones."
        step_5:
          title: "Pago y Entrega"
          description: "Una vez que confirme que todo está bien, vas a poder elegir tu método de pago — efectivo o transferencia bancaria — y coordinar la entrega."
      faq:
        what_is_reservation:
          question: "¿Qué es una reserva?"
          answer: "Una reserva es una solicitud para apartar cartas para vos. No es una compra — pagás cuando confirme la reserva y las cartas estén en orden."
        can_i_cancel:
          question: "¿Puedo cancelar una reserva?"
          answer: "Sí. Podés cancelar cualquier reserva pendiente desde tu página de reservas. Una vez que una reserva ha sido entregada o expirada, no se puede cancelar."
        do_reservations_expire:
          question: "¿Las reservas expiran?"
          answer: "Sí. Si no puedo obtener una confirmación completa y un acuerdo sobre el método de pago y entrega dentro de los 3 días, puedo marcarla como expirada y las cartas volverán a estar disponibles."
        are_prices_final:
          question: "¿Los precios son finales?"
          answer: "Los precios mostrados son estimaciones basadas en valores actuales del mercado, los actualizaré periódicamente según los últimos valores del mercado. El precio final puede variar si la carta no estaba en la condición publicada y solo después de tu confirmación."
        need_account:
          question: "¿Necesito una cuenta?"
          answer: "Sí. Necesitás crear una cuenta e iniciar sesión para agregar cartas al carrito y enviar reservas."
        how_payment_works:
          question: "¿Cómo funciona el pago?"
          answer: "Una vez que tu reserva esté preparada, podés elegir entre dos métodos de pago: efectivo (coordinado en persona) o transferencia bancaria. Si elegís transferencia, vas a ver los datos bancarios (alias y CBU) en la página de la reserva. Los precios están en dólares estadounidenses, y la página muestra la cotización actual del dólar blue para que sepas el equivalente en pesos."
        transfer_receipt:
          question: "¿Cómo confirmo una transferencia bancaria?"
          answer: "Después de hacer la transferencia, podés subir un comprobante (imagen o PDF) directamente desde la página de tu reserva. El comprobante se envía al vendedor para verificación. Una vez confirmado, tu reserva se marcará como pagada."

